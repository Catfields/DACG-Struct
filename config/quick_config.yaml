# ============================================================================
# DACG模型快速测试配置文件
# ============================================================================

# 数据配置（继承基础配置）
data:
  name: "mimic-cxr-a"
  data_path: "/home/y530/handsome/DACG/data/mimic-cxr-a/all_structured_reports.jsonl"
  data_format: "auto"
  image_dir: "/home/y530/handsome/DACG/data/mimic-cxr-a/images"
  mask_dir: "/home/y530/handsome/DACG/data/mimic-cxr-a/masks"
  split_dir: "/home/y530/handsome/DACG/data/mimic-cxr-a"
  
  mask:
    enabled: true
    file_patterns:
      - "*_findings_multiclass_*.png"
      - "*_heart_multiclass_*.png"
      - "*_left_lung_multiclass_*.png"
      - "*_right_lung_multiclass_*.png"
      - "*_background_multiclass_*.png"
    
    organ_mapping:
      background: 0
      left_lung: 1
      right_lung: 2
      heart: 3

# 模型配置（快速版本）
model:
  visual_extractor: "resnet34"  # 更小的模型
  visual_feat_dim: 512
  visual_extractor_pretrained: true
  
  d_model: 256  # 减小模型维度
  num_regions: 4
  num_diseases: auto
  
  vfused_encoder:
    layers: 1
    heads: 4  # 减少注意力头
    d_ff: 1024  # 减小FFN维度
    dropout: 0.1
  
  dropout: 0.1
  device: "auto"

# 训练配置（快速版本）
training:
  batch_size: 4  # 小批次
  num_epochs: 10  # 少量epoch
  learning_rate: 1e-3  # 更大的学习率
  weight_decay: 1e-4
  warmup_epochs: 1
  max_grad_norm: 1.0
  
  optimizer: "adamw"
  scheduler: "cosine_annealing_warm_restarts"
  
  num_workers: 2  # 减少工作进程
  pin_memory: true
  drop_last: true
  
  augmentation:
    enabled: true
    resize: 128  # 更小的图像尺寸
    crop_size: 112
    random_horizontal_flip: 0.5
    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

# 损失函数配置
loss:
  weights:
    mention_loss: 1.0
    polarity_loss: 1.0
    probability_loss: 1.0
    severity_loss: 1.0
    location_loss: 1.0
  
  focal:
    alpha: 0.75
    gamma: 2.0
    eps: 1e-6
  
  clip_grad_norm: 1.0
  use_amp: false

# S-Score评估配置
s_score:
  enabled: true
  interval: 2  # 每2个epoch评估
  threshold: 0.3
  save_best: true
  
  weights:
    p_weight: 0.5
    d_weight: 0.5
  
  strategy: "balanced"

# 实验管理
experiment:
  name: "dacg_quick_test"
  description: "DACG model quick test configuration"
  mode: "quick"
  seed: 42
  resume: null
  
  save:
    dir: "./checkpoints"
    interval: 2  # 更频繁保存
    best_metric: "s_score"
    keep_latest: true
    keep_best: true
  
  logging:
    dir: "./logs"
    level: "INFO"
    save_history: true
    tensorboard: false
  
  early_stopping:
    enabled: true
    patience: 5  # 更短的耐心值
    min_delta: 1e-3
    monitor: "s_score"

# 环境配置
environment:
  device: "cuda"
  mixed_precision: true
  deterministic: false
  
  memory:
    gradient_checkpointing: false
    find_unused_parameters: false
  
  multi_gpu:
    enabled: false
    strategy: "ddp"
