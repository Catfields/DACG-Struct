<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>胸部医疗影像智能诊断系统</title>
  <link rel="stylesheet" href="style.css?v=20251026-1" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="header-main">
        <h1>胸部医疗影像智能诊断系统</h1>
        <p>上传胸部影像，查看器官级别的智能诊断报告</p>
      </div>
      <div class="upload-controls">
        <label class="file-input-label">
          <input type="file" id="fileInput" accept="image/*" hidden />
          <span class="file-icon" aria-hidden="true">📁</span>
          <span id="fileText">选择文件</span>
        </label>
        <button id="predictButton" class="predict-btn" type="button" disabled>开始预测</button>
      </div>
    </header>

    <main id="layout">
      <section id="organ-panel">
        <div class="panel-header">
          <h2>器官区域可视化</h2>
          <span class="panel-subtitle">悬浮查看器官命名，自动联动右侧诊断文本</span>
        </div>

        <div class="compare-stage">
          <div id="previewPanel" class="organ-stage hidden">
            <img id="imagePreview" alt="原始图像预览" class="stage-image base" />
          </div>

          <div id="organ-stage" class="organ-stage">
            <img id="organ-base" alt="原始影像" class="stage-image base" />
            <img id="organ-overlay" alt="器官叠加影像" class="stage-image overlay hidden" />
            <div id="organ-tooltip" hidden></div>
          </div>
        </div>

        <div class="stage-hint">
          支持 JPG / PNG / BMP / GIF / WEBP，文件大小 ≤ 10MB。
        </div>
      </section>

      <section id="report-panel">
        <div class="panel-header">
          <h2>预测结果</h2>
          <div id="resultStatus" class="result-status"></div>
        </div>
        <div id="report-list" class="report-list empty-state">
          <p>上传影像后，将自动生成器官级别的诊断描述。</p>
        </div>
        <div id="impressions-panel" class="impressions-panel hidden">
          <h3>临床总结</h3>
          <p id="impressionsText"></p>
        </div>
      </section>
    </main>

    <section id="support-panels">
      <div id="loader" class="loader hidden">
        <div class="spinner"></div>
        <p>正在处理，请稍候...</p>
      </div>

      <div id="errorBox" class="error-box hidden">
        <h3>错误信息</h3>
        <p id="errorMessage"></p>
      </div>
    </section>

    <footer class="app-footer">
      <p>&copy; 2025 DACG 医疗影像智能诊断系统</p>
    </footer>
  </div>

  <svg id="connector-layer">
    <line id="line-to-organ" class="connector-line" x1="0" y1="0" x2="0" y2="0"></line>
    <line id="line-to-text" class="connector-line" x1="0" y1="0" x2="0" y2="0"></line>
  </svg>

  <script src="script.js?v=20251026-1"></script>
</body>
</html>
